<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OCR to Markdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #d2d2d7; --accent: #0a84ff; --err: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --text: #f5f5f7; --muted: #98989d;
            --line: #3a3a3c; --err: #ff453a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  #drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--card);
          padding: 36px 20px; text-align: center; cursor: pointer; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); }
  #drop b { display: block; font-size: 16px; margin-bottom: 4px; }
  #drop span { color: var(--muted); }
  .opts { display: flex; gap: 18px; align-items: center; margin: 14px 2px 22px; color: var(--muted);
          flex-wrap: wrap; }
  .opts input[type=text] { width: 90px; padding: 4px 6px; border: 1px solid var(--line);
          border-radius: 6px; background: var(--card); color: var(--text); }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         margin-bottom: 16px; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
          border-bottom: 1px solid var(--line); }
  .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { color: var(--muted); font-variant-numeric: tabular-nums; }
  .status.err { color: var(--err); }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--text);
           border-radius: 7px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  pre { margin: 0; padding: 14px; max-height: 520px; overflow: auto; white-space: pre-wrap;
        word-wrap: break-word; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre:empty { display: none; }
  .api { color: var(--muted); margin-top: 30px; font-size: 12.5px; }
  .api code { font: 12px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>OCR to Markdown</h1>
  <p class="sub">OvisOCR2 on this Mac. Drop images or PDFs; nothing leaves the machine.</p>

  <div id="drop" tabindex="0">
    <b>Drop files here, click to choose, or paste an image</b>
    <span>PNG, JPEG, WebP, HEIC, TIFF, PDF</span>
  </div>
  <input id="pick" type="file" multiple accept="image/*,.pdf,.heic,.heif,.tif,.tiff" hidden>

  <div class="opts">
    <label>Pages <input id="pages" type="text" placeholder="all, or 1-3,5"></label>
    <label><input id="html" type="checkbox"> Keep tables as HTML</label>
    <label><input id="imgs" type="checkbox"> Keep figure tags</label>
  </div>

  <div id="jobs"></div>

  <p class="api">From a script or another tool:
    <code>curl --data-binary @scan.pdf -H 'X-Filename: scan.pdf' http://127.0.0.1:8797/ocr</code>
  </p>
</main>

<script>
const drop = document.getElementById("drop");
const pick = document.getElementById("pick");
const jobs = document.getElementById("jobs");
let chain = Promise.resolve();   // one file at a time: the server runs one anyway

drop.addEventListener("click", () => pick.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pick.click(); });
pick.addEventListener("change", () => { addFiles(pick.files); pick.value = ""; });
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
document.addEventListener("paste", e => {
  const files = [...e.clipboardData.items].filter(i => i.kind === "file").map(i => i.getAsFile());
  if (files.length) addFiles(files.map((f, n) =>
    new File([f], f.name && f.name !== "image.png" ? f.name : `pasted-${Date.now()}-${n}.png`, { type: f.type })));
});

function addFiles(list) {
  for (const f of list) {
    const job = makeJob(f);
    chain = chain.then(() => run(job));
  }
}

function makeJob(file) {
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `<div class="head"><span class="name"></span><span class="status">Queued</span>
    <button class="copy" disabled>Copy</button><button class="save" disabled>Download .md</button></div><pre></pre>`;
  el.querySelector(".name").textContent = file.name;
  jobs.prepend(el);
  return { file, el, md: "" };
}

async function run(job) {
  const status = job.el.querySelector(".status");
  const t0 = performance.now();
  const tick = setInterval(() => {
    status.textContent = `Reading… ${((performance.now() - t0) / 1000).toFixed(0)}s`;
  }, 250);
  const q = new URLSearchParams({ format: "json" });
  const pages = document.getElementById("pages").value.trim();
  if (pages) q.set("pages", pages);
  if (document.getElementById("html").checked) q.set("tables", "html");
  if (document.getElementById("imgs").checked) q.set("images", "1");
  try {
    const r = await fetch("/ocr?" + q, {
      method: "POST", body: job.file,
      headers: { "X-Filename": encodeURIComponent(job.file.name).replace(/%20/g, " ") },
    });
    const text = await r.text();
    if (!r.ok) throw new Error(text || r.statusText);
    const res = JSON.parse(text);
    job.md = res.markdown;
    job.el.querySelector("pre").textContent = res.markdown;
    status.textContent = `${res.pages} page${res.pages === 1 ? "" : "s"} · ${res.seconds}s`;
    const copy = job.el.querySelector(".copy"), save = job.el.querySelector(".save");
    copy.disabled = save.disabled = false;
    copy.onclick = async () => {
      await navigator.clipboard.writeText(job.md);
      copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200);
    };
    save.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([job.md + "\n"], { type: "text/markdown" }));
      a.download = job.file.name.replace(/\.[^.]+$/, "") + ".md";
      a.click(); URL.revokeObjectURL(a.href);
    };
  } catch (e) {
    status.textContent = "Failed";
    status.classList.add("err");
    job.el.querySelector("pre").textContent = String(e.message || e);
  } finally {
    clearInterval(tick);
  }
}
</script>
</body>
</html>
